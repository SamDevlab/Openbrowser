name: Windows Package

on:
  pull_request:
    branches: [main]
    paths:
      - "apps/desktop/**"
      - "cmake/OpenbrowserCEF.cmake"
      - "src/core/**"
      - "src/devtools/network/**"
      - "third_party/cef/**"
      - "scripts/package-windows.ps1"
      - "CMakeLists.txt"
      - "LICENSE"
      - "README.md"
      - "THIRD_PARTY.md"
      - ".github/workflows/windows-package.yml"
  push:
    branches: [main]
    paths:
      - "apps/desktop/**"
      - "cmake/OpenbrowserCEF.cmake"
      - "src/core/**"
      - "src/devtools/network/**"
      - "third_party/cef/**"
      - "scripts/package-windows.ps1"
      - "CMakeLists.txt"
      - "LICENSE"
      - "README.md"
      - "THIRD_PARTY.md"
      - ".github/workflows/windows-package.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-package-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CEF_VERSION: 151.3.17+gf059e67+chromium-151.0.7922.138
  CEF_PLATFORM: windows64
  CEF_BASE_URL: https://cef-builds.spotifycdn.com

jobs:
  windows-package:
    name: Windows x64 portable ZIP
    runs-on: windows-2025
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Resolve Openbrowser package version
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $cmake = Get-Content -LiteralPath ./CMakeLists.txt -Raw
          if ($cmake -notmatch 'project\s*\(\s*Openbrowser\s+VERSION\s+([0-9]+\.[0-9]+\.[0-9]+)') {
            throw 'Could not resolve Openbrowser VERSION from CMakeLists.txt.'
          }
          $version = $Matches[1]
          "PACKAGE_VERSION=$version" | Add-Content -LiteralPath $env:GITHUB_ENV
          Write-Host "Openbrowser package version: $version"

      - name: Restore CEF archive cache
        id: cef-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .cache/cef/*.tar.bz2
          key: cef-${{ runner.os }}-${{ runner.arch }}-${{ env.CEF_VERSION }}-${{ env.CEF_PLATFORM }}

      - name: Download and verify exact Windows CEF distribution
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-StrictMode -Version Latest

          $cacheDir = Join-Path $PWD '.cache/cef'
          New-Item -ItemType Directory -Force -Path $cacheDir | Out-Null

          $archive = "cef_binary_${env:CEF_VERSION}_${env:CEF_PLATFORM}.tar.bz2"
          $encodedArchive = $archive.Replace('+', '%2B')
          $archivePath = Join-Path $cacheDir $archive
          $lockFile = Join-Path $PWD 'third_party/cef/checksums.sha1'
          $upstreamShaPath = "$archivePath.upstream.sha1"

          $match = Get-Content -LiteralPath $lockFile | Where-Object {
            $_ -match "^([0-9a-fA-F]{40})\s+$([regex]::Escape($archive))\s*$"
          } | Select-Object -First 1
          if ($null -eq $match) {
            throw "Pinned checksum missing for $archive"
          }
          $expectedSha1 = (($match -split '\s+')[0]).ToLowerInvariant()

          Invoke-WebRequest `
            -Uri "${env:CEF_BASE_URL}/${encodedArchive}.sha1" `
            -OutFile $upstreamShaPath `
            -MaximumRetryCount 3 `
            -RetryIntervalSec 2
          $upstreamSha1 = (Get-Content -LiteralPath $upstreamShaPath -Raw).Trim().ToLowerInvariant()
          if ($upstreamSha1 -notmatch '^[0-9a-f]{40}$') {
            throw "Invalid upstream CEF SHA-1 metadata: $upstreamSha1"
          }
          if ($upstreamSha1 -ne $expectedSha1) {
            throw "CEF checksum mismatch. Pinned=$expectedSha1 Upstream=$upstreamSha1"
          }

          if (-not (Test-Path -LiteralPath $archivePath -PathType Leaf)) {
            Invoke-WebRequest `
              -Uri "${env:CEF_BASE_URL}/${encodedArchive}" `
              -OutFile $archivePath `
              -MaximumRetryCount 3 `
              -RetryIntervalSec 2
          }

          $actualSha1 = (Get-FileHash -LiteralPath $archivePath -Algorithm SHA1).Hash.ToLowerInvariant()
          if ($actualSha1 -ne $expectedSha1) {
            throw "Downloaded CEF archive checksum mismatch. Expected=$expectedSha1 Actual=$actualSha1"
          }

          $extractDir = Join-Path $cacheDir 'extracted-windows'
          if (Test-Path $extractDir) {
            Remove-Item -Recurse -Force $extractDir
          }
          New-Item -ItemType Directory -Force -Path $extractDir | Out-Null

          Push-Location $extractDir
          try {
            cmake -E tar xjf $archivePath
            if ($LASTEXITCODE -ne 0) {
              throw "Failed to extract CEF archive."
            }
          } finally {
            Pop-Location
          }

          $cefRoot = Join-Path $extractDir "cef_binary_${env:CEF_VERSION}_${env:CEF_PLATFORM}"
          if (-not (Test-Path -LiteralPath (Join-Path $cefRoot 'include/cef_version.h') -PathType Leaf)) {
            throw "Extracted CEF_ROOT is invalid: $cefRoot"
          }
          if (-not (Test-Path -LiteralPath (Join-Path $cefRoot 'LICENSE.txt') -PathType Leaf)) {
            throw "CEF LICENSE.txt missing from distribution."
          }
          if (-not (Test-Path -LiteralPath (Join-Path $cefRoot 'CREDITS.html') -PathType Leaf)) {
            throw "CEF CREDITS.html missing from distribution."
          }

          "CEF_ROOT=$cefRoot" | Add-Content -LiteralPath $env:GITHUB_ENV
          Write-Host "Pinned CEF Windows SHA-1 verified: $expectedSha1"

      - name: Save verified CEF archive cache
        if: steps.cef-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .cache/cef/*.tar.bz2
          key: cef-${{ runner.os }}-${{ runner.arch }}-${{ env.CEF_VERSION }}-${{ env.CEF_PLATFORM }}

      - name: Configure Windows desktop
        shell: pwsh
        run: |
          cmake -S . -B build-windows -G "Visual Studio 18 2026" -A x64 `
            -DOPENBROWSER_BUILD_TESTS=OFF `
            -DOPENBROWSER_BUILD_DESKTOP=ON `
            -DCEF_ROOT="$env:CEF_ROOT" `
            -DUSE_SANDBOX=ON
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build Windows desktop
        shell: pwsh
        run: |
          cmake --build build-windows --target openbrowser --config Release --parallel
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build portable package
        shell: pwsh
        run: |
          ./scripts/package-windows.ps1 `
            -BuildDir ./build-windows `
            -CefRoot "$env:CEF_ROOT" `
            -OutputDir ./artifacts `
            -Version "$env:PACKAGE_VERSION"

      - name: Verify and smoke extracted portable package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-StrictMode -Version Latest

          $packageName = "Openbrowser-${env:PACKAGE_VERSION}-windows-x64"
          $zipPath = Join-Path $PWD "artifacts/$packageName.zip"
          $verifyDir = Join-Path $env:RUNNER_TEMP "openbrowser-package-smoke-$([guid]::NewGuid().ToString('N'))"
          New-Item -ItemType Directory -Force -Path $verifyDir | Out-Null
          Expand-Archive -LiteralPath $zipPath -DestinationPath $verifyDir

          $root = Join-Path $verifyDir $packageName
          $required = @(
            'openbrowser.exe',
            'openbrowser.dll',
            'libcef.dll',
            'chrome_elf.dll',
            'icudtl.dat',
            'resources.pak',
            'v8_context_snapshot.bin',
            'START-HERE.txt',
            'OPENBROWSER-LICENSE.txt',
            'THIRD_PARTY.md',
            'CEF-LICENSE.txt',
            'CEF-CREDITS.html'
          )
          foreach ($file in $required) {
            if (-not (Test-Path -LiteralPath (Join-Path $root $file) -PathType Leaf)) {
              throw "ZIP verification failed: missing $file"
            }
          }
          if (-not (Test-Path -LiteralPath (Join-Path $root 'locales') -PathType Container)) {
            throw 'ZIP verification failed: locales directory missing.'
          }

          $developerArtifacts = @(Get-ChildItem -Path $root -Recurse -File | Where-Object {
            $_.Extension -in @('.lib', '.exp', '.pdb', '.ilk', '.obj')
          })
          if ($developerArtifacts.Count -ne 0) {
            throw "ZIP contains developer-only artifacts: $($developerArtifacts.FullName -join ', ')"
          }

          $shaFile = Join-Path $PWD "artifacts/$packageName.zip.sha256"
          $expected = ((Get-Content -LiteralPath $shaFile -Raw) -split '\s+')[0].Trim().ToLowerInvariant()
          $actual = (Get-FileHash -LiteralPath $zipPath -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) {
            throw "Portable ZIP SHA-256 mismatch. Expected=$expected Actual=$actual"
          }

          $exe = Join-Path $root 'openbrowser.exe'
          $env:OPENBROWSER_NONINTERACTIVE = '1'
          $env:OPENBROWSER_SYMBOL_PATH = Join-Path $PWD 'build-windows/apps/desktop/Release'

          # The diagnostic probe goes through the final bootstrap EXE and DLL.
          # It returns zero only after native SID comparison confirms both the
          # inheritable runtime ACL and propagated LPAC read/execute access on
          # libcef.dll, avoiding locale-dependent PowerShell identity parsing.
          $prereq = Start-Process `
            -FilePath $exe `
            -ArgumentList '--openbrowser-sandbox-prereq-check' `
            -WorkingDirectory $root `
            -PassThru `
            -Wait
          if ($prereq.ExitCode -ne 0) {
            Write-Host 'Runtime ACL at prerequisite failure:'
            & icacls.exe $root
            Write-Host 'libcef.dll ACL at prerequisite failure:'
            & icacls.exe (Join-Path $root 'libcef.dll')
            throw "Sandbox prerequisite probe failed with code $($prereq.ExitCode)."
          }

          $smokeStorage = Join-Path $env:RUNNER_TEMP "openbrowser-smoke-state-$([guid]::NewGuid().ToString('N'))"
          New-Item -ItemType Directory -Force -Path $smokeStorage | Out-Null
          $sessionFile = Join-Path $smokeStorage 'session.json'
          $arguments = @(
            '--url=https://example.com',
            '--disable-gpu',
            "--storage-dir=$smokeStorage",
            "--session-file=$sessionFile"
          )

          $process = Start-Process `
            -FilePath $exe `
            -ArgumentList $arguments `
            -WorkingDirectory $root `
            -PassThru
          try {
            Start-Sleep -Seconds 10
            if ($process.HasExited) {
              Write-Host 'Runtime ACL at failure:'
              & icacls.exe $root
              $debugLog = Join-Path $root 'debug.log'
              if (Test-Path -LiteralPath $debugLog -PathType Leaf) {
                Write-Host 'CEF debug.log:'
                Get-Content -LiteralPath $debugLog -Tail 200
              }
              throw "Extracted Openbrowser exited during startup smoke with code $($process.ExitCode)."
            }

            $networkService = Get-CimInstance Win32_Process | Where-Object {
              $_.CommandLine -like "*$root*" -and
              $_.CommandLine -like '*network.mojom.NetworkService*'
            } | Select-Object -First 1
            if ($null -eq $networkService) {
              throw 'CEF Network Service subprocess was not observed during extracted-package smoke.'
            }

            Write-Host "Portable ZIP runtime smoke passed. SHA-256: $actual"
          } finally {
            if (-not $process.HasExited) {
              & taskkill.exe /PID $process.Id /T /F | Out-Null
            }
            Remove-Item Env:OPENBROWSER_NONINTERACTIVE -ErrorAction SilentlyContinue
            Remove-Item Env:OPENBROWSER_SYMBOL_PATH -ErrorAction SilentlyContinue
            Remove-Item -Recurse -Force $smokeStorage -ErrorAction SilentlyContinue
            Remove-Item -Recurse -Force $verifyDir -ErrorAction SilentlyContinue
          }

      - name: Upload Windows portable package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Openbrowser-${{ env.PACKAGE_VERSION }}-windows-x64
          path: |
            artifacts/Openbrowser-${{ env.PACKAGE_VERSION }}-windows-x64.zip
            artifacts/Openbrowser-${{ env.PACKAGE_VERSION }}-windows-x64.zip.sha256
          if-no-files-found: error
          compression-level: 0
