name: Aura omnibox API fix (one shot)

on:
  push:
    branches:
      - design/aura-full-visual-polish
    paths:
      - .github/workflows/aura-omnibox-api-fix-one-shot.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout design branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: design/aura-full-visual-polish
          fetch-depth: 0

      - name: Remove unsupported CefTextfield sizing call
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('apps/desktop/browser_chrome.cpp')
          text = path.read_text(encoding='utf-8')
          old = '    address_bar_->SetMinimumSize(CefSize(320, aura::kOmniboxHeight));\n'
          if text.count(old) != 1:
              raise SystemExit(f'expected one unsupported SetMinimumSize call, found {text.count(old)}')
          path.write_text(text.replace(old, '', 1), encoding='utf-8')
          Path('.github/workflows/aura-omnibox-api-fix-one-shot.yml').unlink()
          PY

      - name: Commit API-compatible fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(ui): keep omnibox sizing on supported CEF Views API"
          git push origin HEAD:design/aura-full-visual-polish
