name: Aura native icon antialias (one shot)

on:
  push:
    branches:
      - design/aura-full-visual-polish
    paths:
      - .github/workflows/aura-icon-antialias-one-shot.yml

permissions:
  contents: write

jobs:
  antialias:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout design branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: design/aura-full-visual-polish
          fetch-depth: 0

      - name: Supersample browser-owned icons
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('apps/desktop/icon_system.cpp')
          text = path.read_text(encoding='utf-8')
          old = '''CefRefPtr<CefImage> BuildIcon(const IconId id) {
              auto image = CefImage::CreateImage();
              for (const int scale : {1, 2}) {
                  Raster raster(scale);
                  DrawIcon(raster, id);
                  image->AddBitmap(
                      static_cast<float>(scale),
                      raster.Size(),
                      raster.Size(),
                      CEF_COLOR_TYPE_BGRA_8888,
                      CEF_ALPHA_TYPE_PREMULTIPLIED,
                      raster.Pixels().data(),
                      raster.Pixels().size() * sizeof(Pixel));
              }
              return image;
          }
          '''
          new = '''std::vector<Pixel> DownsampleIcon(const Raster& source, const int factor) {
              const int source_size = source.Size();
              const int target_size = source_size / factor;
              const auto& source_pixels = source.Pixels();
              std::vector<Pixel> output(
                  static_cast<std::size_t>(target_size) * static_cast<std::size_t>(target_size));

              for (int y = 0; y < target_size; ++y) {
                  for (int x = 0; x < target_size; ++x) {
                      std::uint32_t alpha_sum = 0;
                      for (int sample_y = 0; sample_y < factor; ++sample_y) {
                          for (int sample_x = 0; sample_x < factor; ++sample_x) {
                              const int source_x = x * factor + sample_x;
                              const int source_y = y * factor + sample_y;
                              alpha_sum += source_pixels[
                                  static_cast<std::size_t>(source_y * source_size + source_x)].alpha;
                          }
                      }

                      const auto samples = static_cast<std::uint32_t>(factor * factor);
                      const auto alpha = static_cast<std::uint8_t>(alpha_sum / samples);
                      auto& pixel = output[static_cast<std::size_t>(y * target_size + x)];
                      pixel.alpha = alpha;
                      pixel.blue = static_cast<std::uint8_t>((0xF0u * alpha) / 0xFFu);
                      pixel.green = static_cast<std::uint8_t>((0xE8u * alpha) / 0xFFu);
                      pixel.red = static_cast<std::uint8_t>((0xE1u * alpha) / 0xFFu);
                  }
              }
              return output;
          }

          CefRefPtr<CefImage> BuildIcon(const IconId id) {
              constexpr int kSupersample = 4;
              auto image = CefImage::CreateImage();
              for (const int scale : {1, 2}) {
                  Raster raster(scale * kSupersample);
                  DrawIcon(raster, id);
                  auto pixels = DownsampleIcon(raster, kSupersample);
                  const int target_size = kIconDip * scale;
                  image->AddBitmap(
                      static_cast<float>(scale),
                      target_size,
                      target_size,
                      CEF_COLOR_TYPE_BGRA_8888,
                      CEF_ALPHA_TYPE_PREMULTIPLIED,
                      pixels.data(),
                      pixels.size() * sizeof(Pixel));
              }
              return image;
          }
          '''
          if text.count(old) != 1:
              raise SystemExit(f'BuildIcon replacement expected one match, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          Path('.github/workflows/aura-icon-antialias-one-shot.yml').unlink()
          PY

      - name: Commit final icon implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "style(ui): anti-alias native icon rasterization"
          git push origin HEAD:design/aura-full-visual-polish
