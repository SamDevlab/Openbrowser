name: Aura Visual Polish Migration

on:
  push:
    branches:
      - design/aura-full-visual-polish

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[aura-polish]') }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout design branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5 / Node 24
        with:
          ref: design/aura-full-visual-polish
          fetch-depth: 0

      - name: Apply Aura chrome polish
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"Expected one anchor in {path}, found {count}: {old!r}")
              file.write_text(text.replace(old, new, 1), encoding="utf-8")

          # First-party icon controls share one Aura geometry.
          replace_once(
              "apps/desktop/icon_system.cpp",
              '#include "icon_system.h"\n',
              '#include "icon_system.h"\n\n#include "aura_design_tokens.h"\n',
          )
          replace_once(
              "apps/desktop/icon_system.cpp",
              '    button->SetMinimumSize(CefSize(text.empty() ? 32 : 96, 30));',
              '    button->SetMinimumSize(CefSize(\n        text.empty() ? aura::kIconControlSize : 104,\n        aura::kControlHeight));',
          )

          # Tab strip: visual state replaces prose state while accessibility keeps detail.
          replace_once(
              "apps/desktop/tab_strip.cpp",
              '#include "aura_motion.h"\n',
              '#include "aura_motion.h"\n#include "aura_design_tokens.h"\n',
          )
          replace_once(
              "apps/desktop/tab_strip.cpp",
              "    settings.between_child_spacing = 4;\n"
              "    settings.inside_border_horizontal_spacing = 10;\n"
              "    settings.inside_border_vertical_spacing = 5;",
              "    settings.between_child_spacing = aura::kSpace6;\n"
              "    settings.inside_border_horizontal_spacing = aura::kSpace12;\n"
              "    settings.inside_border_vertical_spacing = aura::kSpace6;",
          )
          replace_once(
              "apps/desktop/tab_strip.cpp",
              '    layout_ = panel_->SetToBoxLayout(settings);\n',
              '    layout_ = panel_->SetToBoxLayout(settings);\n    aura::StyleSurface(panel_, aura::kChromeSurface);\n',
          )
          replace_once(
              "apps/desktop/tab_strip.cpp",
              "        std::string status_suffix;\n"
              "        if (is_active) {\n"
              "            status_suffix += \" (active)\";\n"
              "        }\n"
              "        if (is_discarded) {\n"
              "            status_suffix += \" (sleeping)\";\n"
              "        }\n"
              "        if (tab.navigation_state == core::NavigationState::Loading) {\n"
              "            status_suffix += \" (loading)\";\n"
              "        } else if (tab.navigation_state == core::NavigationState::Failed) {\n"
              "            status_suffix += \" (load failed)\";\n"
              "        }\n\n"
              "        std::string label = title_text + status_suffix;",
              "        std::string label = title_text;",
          )
          replace_once(
              "apps/desktop/tab_strip.cpp",
              "        aura::ConfigureActionButton(\n"
              "            tab_btn,\n"
              "            accessible_name,\n"
              "            is_active ? title_text + \" - Active tab\" : title_text,\n"
              "            aura::kTabAccessibilityGroupId);",
              "        aura::ConfigureActionButton(\n"
              "            tab_btn,\n"
              "            accessible_name,\n"
              "            is_active ? title_text + \" - Active tab\" : title_text,\n"
              "            aura::kTabAccessibilityGroupId);\n"
              "        aura::StyleTabButton(tab_btn, is_active);",
          )
          replace_once(
              "apps/desktop/tab_strip.cpp",
              "            aura::ConfigureActionButton(\n"
              "                close_btn,\n"
              "                \"Close active tab \" + title_text,\n"
              "                \"Close active tab - Ctrl+W\",\n"
              "                aura::kTabAccessibilityGroupId);",
              "            aura::ConfigureActionButton(\n"
              "                close_btn,\n"
              "                \"Close active tab \" + title_text,\n"
              "                \"Close active tab - Ctrl+W\",\n"
              "                aura::kTabAccessibilityGroupId);\n"
              "            aura::StyleIconButton(close_btn, true);\n"
              "            close_btn->SetMinimumSize(CefSize(\n"
              "                aura::kCompactIconControlSize,\n"
              "                aura::kCompactIconControlSize));",
          )
          replace_once(
              "apps/desktop/tab_strip.cpp",
              "    aura::ConfigureActionButton(\n"
              "        new_tab_btn,\n"
              "        \"New tab\",\n"
              "        \"New tab - Ctrl+T\",\n"
              "        aura::kTabAccessibilityGroupId);",
              "    aura::ConfigureActionButton(\n"
              "        new_tab_btn,\n"
              "        \"New tab\",\n"
              "        \"New tab - Ctrl+T\",\n"
              "        aura::kTabAccessibilityGroupId);\n"
              "    aura::StyleIconButton(new_tab_btn);",
          )

          # Toolbar and omnibox.
          replace_once(
              "apps/desktop/browser_chrome.cpp",
              '#include "cef_browser_engine.h"\n',
              '#include "cef_browser_engine.h"\n#include "aura_design_tokens.h"\n',
          )
          replace_once(
              "apps/desktop/browser_chrome.cpp",
              "    container_settings.between_child_spacing = 1;\n"
              "    container_layout_ = container_->SetToBoxLayout(container_settings);",
              "    container_settings.between_child_spacing = aura::kSpace2;\n"
              "    container_layout_ = container_->SetToBoxLayout(container_settings);\n"
              "    aura::StyleSurface(container_, aura::kChromeSurface);",
          )
          replace_once(
              "apps/desktop/browser_chrome.cpp",
              "    toolbar_settings.between_child_spacing = 6;\n"
              "    toolbar_settings.inside_border_horizontal_spacing = 10;\n"
              "    toolbar_settings.inside_border_vertical_spacing = 6;",
              "    toolbar_settings.between_child_spacing = aura::kSpace6;\n"
              "    toolbar_settings.inside_border_horizontal_spacing = aura::kSpace12;\n"
              "    toolbar_settings.inside_border_vertical_spacing = aura::kSpace8;",
          )
          replace_once(
              "apps/desktop/browser_chrome.cpp",
              '    toolbar_layout_ = toolbar_->SetToBoxLayout(toolbar_settings);\n',
              '    toolbar_layout_ = toolbar_->SetToBoxLayout(toolbar_settings);\n    aura::StyleSurface(toolbar_, aura::kChromeSurface);\n',
          )
          replace_once(
              "apps/desktop/browser_chrome.cpp",
              '    address_bar_->SetPlaceholderText("Search or enter an address");\n',
              '    address_bar_->SetPlaceholderText("Search or enter an address");\n'
              '    address_bar_->SetAccessibleName("Address and search bar");\n'
              '    aura::StyleTextField(address_bar_, true);\n',
          )
          replace_once(
              "apps/desktop/browser_chrome.cpp",
              "    ConfigureIconButton(\n"
              "        palette_button_, IconId::More, \"\", \"Command palette\", \"Open command palette\");",
              "    ConfigureIconButton(\n"
              "        palette_button_, IconId::More, \"\", \"Command palette\", \"Open command palette\");\n\n"
              "    aura::StyleIconButton(back_button_);\n"
              "    aura::StyleIconButton(forward_button_);\n"
              "    aura::StyleIconButton(reload_button_);\n"
              "    aura::StyleIconButton(security_badge_);\n"
              "    aura::StyleIconButton(bookmarks_button_);\n"
              "    aura::StyleIconButton(downloads_button_);\n"
              "    aura::StyleIconButton(profile_button_);\n"
              "    aura::StyleIconButton(palette_button_);",
          )
          replace_once(
              "apps/desktop/browser_chrome.cpp",
              "    prompt_layout_ = prompt_panel_->SetToBoxLayout(prompt_settings);\n\n"
              "    prompt_label_ = CefLabelButton::CreateLabelButton(",
              "    prompt_layout_ = prompt_panel_->SetToBoxLayout(prompt_settings);\n"
              "    aura::StyleSurface(prompt_panel_, aura::kSurfaceRaised);\n\n"
              "    prompt_label_ = CefLabelButton::CreateLabelButton(",
          )
          replace_once(
              "apps/desktop/browser_chrome.cpp",
              "    block_button_ = CefLabelButton::CreateLabelButton(\n"
              "        make_delegate(ChromeAction::BlockPermission), \"Block\");",
              "    block_button_ = CefLabelButton::CreateLabelButton(\n"
              "        make_delegate(ChromeAction::BlockPermission), \"Block\");\n"
              "    aura::StylePassiveLabel(prompt_label_);\n"
              "    aura::StyleButton(allow_once_button_, true);\n"
              "    aura::StyleButton(always_allow_button_);\n"
              "    aura::StyleButton(block_button_);\n"
              "    block_button_->SetTextColor(CEF_BUTTON_STATE_NORMAL, aura::kDanger);\n"
              "    block_button_->SetTextColor(CEF_BUTTON_STATE_HOVERED, aura::kDanger);",
          )
          replace_once(
              "apps/desktop/browser_chrome.cpp",
              "    security_details_layout_ = security_details_panel_->SetToBoxLayout(details_settings);\n\n"
              "    security_details_label_ = CefLabelButton::CreateLabelButton(",
              "    security_details_layout_ = security_details_panel_->SetToBoxLayout(details_settings);\n"
              "    aura::StyleSurface(security_details_panel_, aura::kSurfaceRaised);\n\n"
              "    security_details_label_ = CefLabelButton::CreateLabelButton(",
          )
          replace_once(
              "apps/desktop/browser_chrome.cpp",
              "    reset_permissions_button_ = CefLabelButton::CreateLabelButton(\n"
              "        make_delegate(ChromeAction::ResetOriginPermissions), \"Reset rules\");",
              "    reset_permissions_button_ = CefLabelButton::CreateLabelButton(\n"
              "        make_delegate(ChromeAction::ResetOriginPermissions), \"Reset rules\");\n"
              "    aura::StylePassiveLabel(security_details_label_);\n"
              "    aura::StyleButton(reset_permissions_button_);",
          )

          # Sidebar.
          replace_once(
              "apps/desktop/aura_sidebar.cpp",
              '#include "aura_motion.h"\n',
              '#include "aura_motion.h"\n#include "aura_design_tokens.h"\n',
          )
          replace_once(
              "apps/desktop/aura_sidebar.cpp",
              '        return CefSize(sidebar_.IsCollapsed() ? 54 : 202, 640);',
              '        return CefSize(\n            sidebar_.IsCollapsed() ? aura::kSidebarRailWidth : aura::kSidebarExpandedWidth,\n            640);',
          )
          replace_once(
              "apps/desktop/aura_sidebar.cpp",
              '        return CefSize(sidebar_.IsCollapsed() ? 50 : 180, 240);',
              '        return CefSize(sidebar_.IsCollapsed() ? aura::kSidebarRailWidth : 190, 240);',
          )
          replace_once(
              "apps/desktop/aura_sidebar.cpp",
              "    settings.between_child_spacing = 5;\n"
              "    settings.inside_border_horizontal_spacing = 6;\n"
              "    settings.inside_border_vertical_spacing = 8;",
              "    settings.between_child_spacing = aura::kSpace6;\n"
              "    settings.inside_border_horizontal_spacing = aura::kSpace8;\n"
              "    settings.inside_border_vertical_spacing = aura::kSpace10;",
          )
          replace_once(
              "apps/desktop/aura_sidebar.cpp",
              '    layout_ = panel_->SetToBoxLayout(settings);\n',
              '    layout_ = panel_->SetToBoxLayout(settings);\n    aura::StyleSurface(panel_, aura::kChromeSurface);\n',
          )
          replace_once(
              "apps/desktop/aura_sidebar.cpp",
              "        aura::ConfigureActionButton(\n"
              "            button,\n"
              "            accessible_name,\n"
              "            tooltip,\n"
              "            aura::kSidebarAccessibilityGroupId);",
              "        aura::ConfigureActionButton(\n"
              "            button,\n"
              "            accessible_name,\n"
              "            tooltip,\n"
              "            aura::kSidebarAccessibilityGroupId);\n"
              "        if (collapsed_) {\n"
              "            aura::StyleIconButton(button);\n"
              "        } else {\n"
              "            aura::StyleButton(button);\n"
              "            button->SetHorizontalAlignment(CEF_HORIZONTAL_ALIGNMENT_LEFT);\n"
              "        }",
          )
          replace_once(
              "apps/desktop/aura_sidebar.cpp",
              "        const std::string expanded = is_active\n"
              "            ? workspace.name + \" (active)\"\n"
              "            : workspace.name;",
              "        const std::string expanded = workspace.name;",
          )
          replace_once(
              "apps/desktop/aura_sidebar.cpp",
              "        if (is_active) {\n"
              "            aura::ApplySelectedAccent(button, workspace_color);\n"
              "        } else {",
              "        if (is_active) {\n"
              "            aura::ApplySelectedAccent(button, workspace_color);\n"
              "            button->SetBackgroundColor(aura::kSurfaceSelected);\n"
              "        } else {",
          )
          replace_once(
              "apps/desktop/aura_sidebar.cpp",
              '        feedback->SetEnabled(false);\n',
              '        feedback->SetEnabled(false);\n        aura::StylePassiveLabel(feedback, false, true);\n',
          )

          # Command Palette.
          replace_once(
              "apps/desktop/command_palette_overlay.cpp",
              '#include "command_palette_overlay.h"\n',
              '#include "command_palette_overlay.h"\n\n#include "aura_accessibility.h"\n#include "aura_design_tokens.h"\n',
          )
          replace_once(
              "apps/desktop/command_palette_overlay.cpp",
              "    container_settings.between_child_spacing = 4;\n"
              "    container_settings.inside_border_horizontal_spacing = 12;\n"
              "    container_settings.inside_border_vertical_spacing = 8;",
              "    container_settings.between_child_spacing = aura::kPanelGap;\n"
              "    container_settings.inside_border_horizontal_spacing = aura::kPanelPadding;\n"
              "    container_settings.inside_border_vertical_spacing = aura::kPanelPadding;",
          )
          replace_once(
              "apps/desktop/command_palette_overlay.cpp",
              '    container_layout_ = container_->SetToBoxLayout(container_settings);\n',
              '    container_layout_ = container_->SetToBoxLayout(container_settings);\n    aura::StyleSurface(container_, aura::kSurfaceRaised);\n',
          )
          replace_once(
              "apps/desktop/command_palette_overlay.cpp",
              '    search_field_->SetPlaceholderText("Type a command or search action (e.g. \'network\', \'tab\', \'focus\')...");\n',
              '    search_field_->SetPlaceholderText("Search commands");\n'
              '    search_field_->SetAccessibleName("Search Openbrowser commands");\n'
              '    aura::StyleTextField(search_field_, true);\n',
          )
          replace_once(
              "apps/desktop/command_palette_overlay.cpp",
              '    results_settings.between_child_spacing = 2;',
              '    results_settings.between_child_spacing = aura::kSpace4;',
          )
          replace_once(
              "apps/desktop/command_palette_overlay.cpp",
              '    results_layout_ = results_panel_->SetToBoxLayout(results_settings);\n',
              '    results_layout_ = results_panel_->SetToBoxLayout(results_settings);\n    aura::StyleSurface(results_panel_, aura::kSurfaceRaised);\n',
          )
          replace_once(
              "apps/desktop/command_palette_overlay.cpp",
              "        std::string label = \"[\" + core::ActionCategoryToString(res.action.category) + \"] \" +\n"
              "                            res.action.title + \" - \" + res.action.description;\n"
              "        if (!res.action.shortcut_hint.empty()) {\n"
              "            label += \" (\" + res.action.shortcut_hint + \")\";\n"
              "        }",
              "        std::string label = res.action.title;\n"
              "        if (!res.action.shortcut_hint.empty()) {\n"
              "            label += \"    \" + res.action.shortcut_hint;\n"
              "        }\n"
              "        std::string accessible = core::ActionCategoryToString(res.action.category) +\n"
              "            \", \" + res.action.title + \". \" + res.action.description;\n"
              "        if (!res.action.shortcut_hint.empty()) {\n"
              "            accessible += \". Shortcut \" + res.action.shortcut_hint;\n"
              "        }",
          )
          replace_once(
              "apps/desktop/command_palette_overlay.cpp",
              "        auto btn = CefLabelButton::CreateLabelButton(delegate, label);\n"
              "        results_panel_->AddChildView(btn);",
              "        auto btn = CefLabelButton::CreateLabelButton(delegate, label);\n"
              "        aura::ConfigureActionButton(btn, accessible, res.action.description);\n"
              "        aura::StyleButton(btn, i == 0);\n"
              "        btn->SetHorizontalAlignment(CEF_HORIZONTAL_ALIGNMENT_LEFT);\n"
              "        btn->SetMinimumSize(CefSize(360, aura::kControlHeight));\n"
              "        results_panel_->AddChildView(btn);",
          )

      - name: Validate design patch shape
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          grep -F '#include "aura_design_tokens.h"' apps/desktop/tab_strip.cpp
          grep -F 'aura::StyleTextField(address_bar_, true);' apps/desktop/browser_chrome.cpp
          grep -F 'const std::string expanded = workspace.name;' apps/desktop/aura_sidebar.cpp
          grep -F 'std::string label = res.action.title;' apps/desktop/command_palette_overlay.cpp
          if grep -F 'status_suffix' apps/desktop/tab_strip.cpp; then
            echo 'Visible tab state suffix survived visual cleanup.' >&2
            exit 1
          fi

      - name: Commit visual foundation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/desktop/icon_system.cpp apps/desktop/tab_strip.cpp \
            apps/desktop/browser_chrome.cpp apps/desktop/aura_sidebar.cpp \
            apps/desktop/command_palette_overlay.cpp
          git diff --cached --check
          git commit -m "feat(design): polish Aura chrome hierarchy [aura-polish]"
          git push origin HEAD:design/aura-full-visual-polish
