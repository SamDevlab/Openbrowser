name: Aura Visual Polish Migration

on:
  push:
    branches:
      - design/aura-full-visual-polish

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[aura-polish]') }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout design branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5 / Node 24
        with:
          ref: design/aura-full-visual-polish
          fetch-depth: 0

      - name: Apply Aura chrome polish
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"Expected one anchor in {path}, found {count}: {old!r}")
              file.write_text(text.replace(old, new, 1), encoding="utf-8")

          # First-party icon controls share the same Aura geometry.
          replace_once(
              "apps/desktop/icon_system.cpp",
              '#include "icon_system.h"\n',
              '#include "icon_system.h"\n\n#include "aura_design_tokens.h"\n',
          )
          replace_once(
              "apps/desktop/icon_system.cpp",
              '    button->SetMinimumSize(CefSize(text.empty() ? 32 : 96, 30));',
              '    button->SetMinimumSize(CefSize(\n        text.empty() ? aura::kIconControlSize : 104,\n        aura::kControlHeight));',
          )

          # Tab strip: remove visible state prose, keep it in accessibility, and
          # create a calm active/inactive hierarchy.
          replace_once(
              "apps/desktop/tab_strip.cpp",
              '#include "aura_motion.h"\n',
              '#include "aura_motion.h"\n#include "aura_design_tokens.h"\n',
          )
          replace_once(
              "apps/desktop/tab_strip.cpp",
              '''    settings.between_child_spacing = 4;
              settings.inside_border_horizontal_spacing = 10;
              settings.inside_border_vertical_spacing = 5;'''.replace('              ', ''),
              '''    settings.between_child_spacing = aura::kSpace6;
              settings.inside_border_horizontal_spacing = aura::kSpace12;
              settings.inside_border_vertical_spacing = aura::kSpace6;'''.replace('              ', ''),
          )
          replace_once(
              "apps/desktop/tab_strip.cpp",
              '    layout_ = panel_->SetToBoxLayout(settings);\n',
              '    layout_ = panel_->SetToBoxLayout(settings);\n    aura::StyleSurface(panel_, aura::kChromeSurface);\n',
          )
          replace_once(
              "apps/desktop/tab_strip.cpp",
              '''        std::string status_suffix;
              if (is_active) {
                  status_suffix += " (active)";
              }
              if (is_discarded) {
                  status_suffix += " (sleeping)";
              }
              if (tab.navigation_state == core::NavigationState::Loading) {
                  status_suffix += " (loading)";
              } else if (tab.navigation_state == core::NavigationState::Failed) {
                  status_suffix += " (load failed)";
              }

              std::string label = title_text + status_suffix;'''.replace('              ', ''),
              '        std::string label = title_text;',
          )
          replace_once(
              "apps/desktop/tab_strip.cpp",
              '''        aura::ConfigureActionButton(
              tab_btn,
              accessible_name,
              is_active ? title_text + " - Active tab" : title_text,
              aura::kTabAccessibilityGroupId);'''.replace('              ', ''),
              '''        aura::ConfigureActionButton(
              tab_btn,
              accessible_name,
              is_active ? title_text + " - Active tab" : title_text,
              aura::kTabAccessibilityGroupId);
              aura::StyleTabButton(tab_btn, is_active);'''.replace('              ', ''),
          )
          replace_once(
              "apps/desktop/tab_strip.cpp",
              '''            aura::ConfigureActionButton(
                  close_btn,
                  "Close active tab " + title_text,
                  "Close active tab - Ctrl+W",
                  aura::kTabAccessibilityGroupId);'''.replace('                  ', ''),
              '''            aura::ConfigureActionButton(
                  close_btn,
                  "Close active tab " + title_text,
                  "Close active tab - Ctrl+W",
                  aura::kTabAccessibilityGroupId);
                  aura::StyleIconButton(close_btn, true);
                  close_btn->SetMinimumSize(CefSize(
                      aura::kCompactIconControlSize,
                      aura::kCompactIconControlSize));'''.replace('                  ', ''),
          )
          replace_once(
              "apps/desktop/tab_strip.cpp",
              '''    aura::ConfigureActionButton(
              new_tab_btn,
              "New tab",
              "New tab - Ctrl+T",
              aura::kTabAccessibilityGroupId);'''.replace('              ', ''),
              '''    aura::ConfigureActionButton(
              new_tab_btn,
              "New tab",
              "New tab - Ctrl+T",
              aura::kTabAccessibilityGroupId);
              aura::StyleIconButton(new_tab_btn);'''.replace('              ', ''),
          )

          # Toolbar/omnibox: one surface, predictable hit targets, a distinct
          # omnibox, and quieter transient security/permission rows.
          replace_once(
              "apps/desktop/browser_chrome.cpp",
              '#include "cef_browser_engine.h"\n',
              '#include "cef_browser_engine.h"\n#include "aura_design_tokens.h"\n',
          )
          replace_once(
              "apps/desktop/browser_chrome.cpp",
              '''    container_settings.between_child_spacing = 1;
              container_layout_ = container_->SetToBoxLayout(container_settings);'''.replace('              ', ''),
              '''    container_settings.between_child_spacing = aura::kSpace2;
              container_layout_ = container_->SetToBoxLayout(container_settings);
              aura::StyleSurface(container_, aura::kChromeSurface);'''.replace('              ', ''),
          )
          replace_once(
              "apps/desktop/browser_chrome.cpp",
              '''    toolbar_settings.between_child_spacing = 6;
              toolbar_settings.inside_border_horizontal_spacing = 10;
              toolbar_settings.inside_border_vertical_spacing = 6;'''.replace('              ', ''),
              '''    toolbar_settings.between_child_spacing = aura::kSpace6;
              toolbar_settings.inside_border_horizontal_spacing = aura::kSpace12;
              toolbar_settings.inside_border_vertical_spacing = aura::kSpace8;'''.replace('              ', ''),
          )
          replace_once(
              "apps/desktop/browser_chrome.cpp",
              '    toolbar_layout_ = toolbar_->SetToBoxLayout(toolbar_settings);\n',
              '    toolbar_layout_ = toolbar_->SetToBoxLayout(toolbar_settings);\n    aura::StyleSurface(toolbar_, aura::kChromeSurface);\n',
          )
          replace_once(
              "apps/desktop/browser_chrome.cpp",
              '    address_bar_->SetPlaceholderText("Search or enter an address");\n',
              '''    address_bar_->SetPlaceholderText("Search or enter an address");
              address_bar_->SetAccessibleName("Address and search bar");
              aura::StyleTextField(address_bar_, true);'''.replace('              ', '') + '\n',
          )
          replace_once(
              "apps/desktop/browser_chrome.cpp",
              '''    ConfigureIconButton(
              palette_button_, IconId::More, "", "Command palette", "Open command palette");'''.replace('              ', ''),
              '''    ConfigureIconButton(
              palette_button_, IconId::More, "", "Command palette", "Open command palette");

              aura::StyleIconButton(back_button_);
              aura::StyleIconButton(forward_button_);
              aura::StyleIconButton(reload_button_);
              aura::StyleIconButton(security_badge_);
              aura::StyleIconButton(bookmarks_button_);
              aura::StyleIconButton(downloads_button_);
              aura::StyleIconButton(profile_button_);
              aura::StyleIconButton(palette_button_);'''.replace('              ', ''),
          )
          replace_once(
              "apps/desktop/browser_chrome.cpp",
              '''    prompt_layout_ = prompt_panel_->SetToBoxLayout(prompt_settings);

              prompt_label_ = CefLabelButton::CreateLabelButton('''.replace('              ', ''),
              '''    prompt_layout_ = prompt_panel_->SetToBoxLayout(prompt_settings);
              aura::StyleSurface(prompt_panel_, aura::kSurfaceRaised);

              prompt_label_ = CefLabelButton::CreateLabelButton('''.replace('              ', ''),
          )
          replace_once(
              "apps/desktop/browser_chrome.cpp",
              '''    block_button_ = CefLabelButton::CreateLabelButton(
              make_delegate(ChromeAction::BlockPermission), "Block");'''.replace('              ', ''),
              '''    block_button_ = CefLabelButton::CreateLabelButton(
              make_delegate(ChromeAction::BlockPermission), "Block");
              aura::StylePassiveLabel(prompt_label_);
              aura::StyleButton(allow_once_button_, true);
              aura::StyleButton(always_allow_button_);
              aura::StyleButton(block_button_);
              block_button_->SetTextColor(CEF_BUTTON_STATE_NORMAL, aura::kDanger);
              block_button_->SetTextColor(CEF_BUTTON_STATE_HOVERED, aura::kDanger);'''.replace('              ', ''),
          )
          replace_once(
              "apps/desktop/browser_chrome.cpp",
              '''    security_details_layout_ = security_details_panel_->SetToBoxLayout(details_settings);

              security_details_label_ = CefLabelButton::CreateLabelButton('''.replace('              ', ''),
              '''    security_details_layout_ = security_details_panel_->SetToBoxLayout(details_settings);
              aura::StyleSurface(security_details_panel_, aura::kSurfaceRaised);

              security_details_label_ = CefLabelButton::CreateLabelButton('''.replace('              ', ''),
          )
          replace_once(
              "apps/desktop/browser_chrome.cpp",
              '''    reset_permissions_button_ = CefLabelButton::CreateLabelButton(
              make_delegate(ChromeAction::ResetOriginPermissions), "Reset rules");'''.replace('              ', ''),
              '''    reset_permissions_button_ = CefLabelButton::CreateLabelButton(
              make_delegate(ChromeAction::ResetOriginPermissions), "Reset rules");
              aura::StylePassiveLabel(security_details_label_);
              aura::StyleButton(reset_permissions_button_);'''.replace('              ', ''),
          )

          # Sidebar: stronger shell identity, no redundant "(active)" prose,
          # larger rail targets, and selection carried visually/accessibly.
          replace_once(
              "apps/desktop/aura_sidebar.cpp",
              '#include "aura_motion.h"\n',
              '#include "aura_motion.h"\n#include "aura_design_tokens.h"\n',
          )
          replace_once(
              "apps/desktop/aura_sidebar.cpp",
              '        return CefSize(sidebar_.IsCollapsed() ? 54 : 202, 640);',
              '        return CefSize(\n            sidebar_.IsCollapsed() ? aura::kSidebarRailWidth : aura::kSidebarExpandedWidth,\n            640);',
          )
          replace_once(
              "apps/desktop/aura_sidebar.cpp",
              '        return CefSize(sidebar_.IsCollapsed() ? 50 : 180, 240);',
              '        return CefSize(sidebar_.IsCollapsed() ? aura::kSidebarRailWidth : 190, 240);',
          )
          replace_once(
              "apps/desktop/aura_sidebar.cpp",
              '''    settings.between_child_spacing = 5;
              settings.inside_border_horizontal_spacing = 6;
              settings.inside_border_vertical_spacing = 8;'''.replace('              ', ''),
              '''    settings.between_child_spacing = aura::kSpace6;
              settings.inside_border_horizontal_spacing = aura::kSpace8;
              settings.inside_border_vertical_spacing = aura::kSpace10;'''.replace('              ', ''),
          )
          replace_once(
              "apps/desktop/aura_sidebar.cpp",
              '    layout_ = panel_->SetToBoxLayout(settings);\n',
              '    layout_ = panel_->SetToBoxLayout(settings);\n    aura::StyleSurface(panel_, aura::kChromeSurface);\n',
          )
          replace_once(
              "apps/desktop/aura_sidebar.cpp",
              '''        aura::ConfigureActionButton(
              button,
              accessible_name,
              tooltip,
              aura::kSidebarAccessibilityGroupId);'''.replace('              ', ''),
              '''        aura::ConfigureActionButton(
              button,
              accessible_name,
              tooltip,
              aura::kSidebarAccessibilityGroupId);
              if (collapsed_) {
                  aura::StyleIconButton(button);
              } else {
                  aura::StyleButton(button);
                  button->SetHorizontalAlignment(CEF_HORIZONTAL_ALIGNMENT_LEFT);
              }'''.replace('              ', ''),
          )
          replace_once(
              "apps/desktop/aura_sidebar.cpp",
              '''        const std::string expanded = is_active
              ? workspace.name + " (active)"
              : workspace.name;'''.replace('              ', ''),
              '        const std::string expanded = workspace.name;',
          )
          replace_once(
              "apps/desktop/aura_sidebar.cpp",
              '''        if (is_active) {
              aura::ApplySelectedAccent(button, workspace_color);
              } else {'''.replace('              ', ''),
              '''        if (is_active) {
              aura::ApplySelectedAccent(button, workspace_color);
              button->SetBackgroundColor(aura::kSurfaceSelected);
              } else {'''.replace('              ', ''),
          )
          replace_once(
              "apps/desktop/aura_sidebar.cpp",
              '        feedback->SetEnabled(false);\n',
              '        feedback->SetEnabled(false);\n        aura::StylePassiveLabel(feedback, false, true);\n',
          )

          # Command Palette: move from diagnostic list styling to a focused
          # command surface while preserving all action metadata for AT/tooltips.
          replace_once(
              "apps/desktop/command_palette_overlay.cpp",
              '#include "command_palette_overlay.h"\n',
              '#include "command_palette_overlay.h"\n\n#include "aura_accessibility.h"\n#include "aura_design_tokens.h"\n',
          )
          replace_once(
              "apps/desktop/command_palette_overlay.cpp",
              '''    container_settings.between_child_spacing = 4;
              container_settings.inside_border_horizontal_spacing = 12;
              container_settings.inside_border_vertical_spacing = 8;'''.replace('              ', ''),
              '''    container_settings.between_child_spacing = aura::kPanelGap;
              container_settings.inside_border_horizontal_spacing = aura::kPanelPadding;
              container_settings.inside_border_vertical_spacing = aura::kPanelPadding;'''.replace('              ', ''),
          )
          replace_once(
              "apps/desktop/command_palette_overlay.cpp",
              '    container_layout_ = container_->SetToBoxLayout(container_settings);\n',
              '    container_layout_ = container_->SetToBoxLayout(container_settings);\n    aura::StyleSurface(container_, aura::kSurfaceRaised);\n',
          )
          replace_once(
              "apps/desktop/command_palette_overlay.cpp",
              '    search_field_->SetPlaceholderText("Type a command or search action (e.g. \'network\', \'tab\', \'focus\')...");\n',
              '''    search_field_->SetPlaceholderText("Search commands");
              search_field_->SetAccessibleName("Search Openbrowser commands");
              aura::StyleTextField(search_field_, true);'''.replace('              ', '') + '\n',
          )
          replace_once(
              "apps/desktop/command_palette_overlay.cpp",
              '''    results_settings.between_child_spacing = 2;
              results_settings.cross_axis_alignment = CEF_AXIS_ALIGNMENT_STRETCH;'''.replace('              ', ''),
              '''    results_settings.between_child_spacing = aura::kSpace4;
              results_settings.cross_axis_alignment = CEF_AXIS_ALIGNMENT_STRETCH;'''.replace('              ', ''),
          )
          replace_once(
              "apps/desktop/command_palette_overlay.cpp",
              '    results_layout_ = results_panel_->SetToBoxLayout(results_settings);\n',
              '    results_layout_ = results_panel_->SetToBoxLayout(results_settings);\n    aura::StyleSurface(results_panel_, aura::kSurfaceRaised);\n',
          )
          replace_once(
              "apps/desktop/command_palette_overlay.cpp",
              '''        std::string label = "[" + core::ActionCategoryToString(res.action.category) + "] " +
                                      res.action.title + " - " + res.action.description;
              if (!res.action.shortcut_hint.empty()) {
                  label += " (" + res.action.shortcut_hint + ")";
              }'''.replace('              ', ''),
              '''        std::string label = res.action.title;
              if (!res.action.shortcut_hint.empty()) {
                  label += "    " + res.action.shortcut_hint;
              }
              std::string accessible = core::ActionCategoryToString(res.action.category) +
                  ", " + res.action.title + ". " + res.action.description;
              if (!res.action.shortcut_hint.empty()) {
                  accessible += ". Shortcut " + res.action.shortcut_hint;
              }'''.replace('              ', ''),
          )
          replace_once(
              "apps/desktop/command_palette_overlay.cpp",
              '''        auto btn = CefLabelButton::CreateLabelButton(delegate, label);
              results_panel_->AddChildView(btn);'''.replace('              ', ''),
              '''        auto btn = CefLabelButton::CreateLabelButton(delegate, label);
              aura::ConfigureActionButton(btn, accessible, res.action.description);
              aura::StyleButton(btn, i == 0);
              btn->SetHorizontalAlignment(CEF_HORIZONTAL_ALIGNMENT_LEFT);
              btn->SetMinimumSize(CefSize(360, aura::kControlHeight));
              results_panel_->AddChildView(btn);'''.replace('              ', ''),
          )

      - name: Validate design patch shape
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          grep -F '#include "aura_design_tokens.h"' apps/desktop/tab_strip.cpp
          grep -F 'aura::StyleTextField(address_bar_, true);' apps/desktop/browser_chrome.cpp
          grep -F 'const std::string expanded = workspace.name;' apps/desktop/aura_sidebar.cpp
          grep -F 'std::string label = res.action.title;' apps/desktop/command_palette_overlay.cpp
          if grep -F 'status_suffix' apps/desktop/tab_strip.cpp; then
            echo 'Visible tab state suffix survived visual cleanup.' >&2
            exit 1
          fi

      - name: Commit visual foundation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/desktop/icon_system.cpp apps/desktop/tab_strip.cpp \
            apps/desktop/browser_chrome.cpp apps/desktop/aura_sidebar.cpp \
            apps/desktop/command_palette_overlay.cpp
          git diff --cached --check
          git commit -m "feat(design): polish Aura chrome hierarchy [aura-polish]"
          git push origin HEAD:design/aura-full-visual-polish
