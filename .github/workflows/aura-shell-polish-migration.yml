name: Aura Shell Polish Migration

on:
  push:
    branches:
      - design/aura-full-visual-polish

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[aura-shell]') }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout design branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5 / Node 24
        with:
          ref: design/aura-full-visual-polish
          fetch-depth: 0

      - name: Apply Aura shell polish
        shell: python
        run: |
          from pathlib import Path

          def r(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"Expected one anchor in {path}, found {count}: {old!r}")
              p.write_text(text.replace(old, new, 1), encoding="utf-8")

          # Align native Aura chrome with the already-established New Tab palette.
          p = "apps/desktop/aura_design_tokens.h"
          r(p,
            "inline constexpr cef_color_t kCanvas = static_cast<cef_color_t>(0xFF0D1016u);\n"
            "inline constexpr cef_color_t kChromeSurface = static_cast<cef_color_t>(0xFF131821u);\n"
            "inline constexpr cef_color_t kSurface = static_cast<cef_color_t>(0xFF181E29u);\n"
            "inline constexpr cef_color_t kSurfaceRaised = static_cast<cef_color_t>(0xFF202735u);\n"
            "inline constexpr cef_color_t kSurfaceSelected = static_cast<cef_color_t>(0xFF292F43u);\n"
            "inline constexpr cef_color_t kInputSurface = static_cast<cef_color_t>(0xFF10151Du);\n"
            "inline constexpr cef_color_t kBorderSubtle = static_cast<cef_color_t>(0xFF303849u);\n"
            "inline constexpr cef_color_t kTextPrimary = static_cast<cef_color_t>(0xFFF3F6FBu);\n"
            "inline constexpr cef_color_t kTextSecondary = static_cast<cef_color_t>(0xFFB7C0CDu);\n"
            "inline constexpr cef_color_t kTextMuted = static_cast<cef_color_t>(0xFF7F8A9Au);\n"
            "inline constexpr cef_color_t kAccent = static_cast<cef_color_t>(0xFF8C82FFu);\n"
            "inline constexpr cef_color_t kAccentSoft = static_cast<cef_color_t>(0xFF343053u);\n"
            "inline constexpr cef_color_t kDanger = static_cast<cef_color_t>(0xFFFF7A8Au);",
            "inline constexpr cef_color_t kCanvas = static_cast<cef_color_t>(0xFF0F1016u);\n"
            "inline constexpr cef_color_t kChromeSurface = static_cast<cef_color_t>(0xFF14151Du);\n"
            "inline constexpr cef_color_t kPrivateChromeSurface = static_cast<cef_color_t>(0xFF181528u);\n"
            "inline constexpr cef_color_t kSurface = static_cast<cef_color_t>(0xFF1B1C26u);\n"
            "inline constexpr cef_color_t kSurfaceRaised = static_cast<cef_color_t>(0xFF20212Du);\n"
            "inline constexpr cef_color_t kSurfaceSelected = static_cast<cef_color_t>(0xFF292A3Au);\n"
            "inline constexpr cef_color_t kInputSurface = static_cast<cef_color_t>(0xFF0E0F16u);\n"
            "inline constexpr cef_color_t kBorderSubtle = static_cast<cef_color_t>(0xFF31323Fu);\n"
            "inline constexpr cef_color_t kTextPrimary = static_cast<cef_color_t>(0xFFF5F5F7u);\n"
            "inline constexpr cef_color_t kTextSecondary = static_cast<cef_color_t>(0xFFA8A9B4u);\n"
            "inline constexpr cef_color_t kTextMuted = static_cast<cef_color_t>(0xFF777987u);\n"
            "inline constexpr cef_color_t kAccent = static_cast<cef_color_t>(0xFF7567FFu);\n"
            "inline constexpr cef_color_t kAccentSoft = static_cast<cef_color_t>(0xFF2F2A51u);\n"
            "inline constexpr cef_color_t kDanger = static_cast<cef_color_t>(0xFFFF7A8Au);")
          r(p,
            "        button->SetMinimumSize(CefSize(kIconControlSize, kIconControlSize));\n",
            "        button->SetMinimumSize(CefSize(kIconControlSize, kIconControlSize));\n"
            "        button->SetMaximumSize(CefSize(kIconControlSize, kIconControlSize));\n")

          # Remove native-theme gaps around the browser host and drawers.
          p = "apps/desktop/desktop_app.cpp"
          r(p,
            '#include "desktop_app.h"\n\n#include "core/navigation/internal_urls.h"\n',
            '#include "desktop_app.h"\n\n#include "aura_design_tokens.h"\n#include "core/navigation/internal_urls.h"\n')
          r(p,
            '        window->SetTitle("Openbrowser");\n',
            '        window->SetTitle("Openbrowser");\n        window->SetBackgroundColor(aura::kCanvas);\n')
          r(p,
            '        CefRefPtr<CefBoxLayout> root_layout = root_panel->SetToBoxLayout(root_settings);\n',
            '        CefRefPtr<CefBoxLayout> root_layout = root_panel->SetToBoxLayout(root_settings);\n        aura::StyleSurface(root_panel, aura::kCanvas);\n')
          r(p,
            '        CefRefPtr<CefBoxLayout> body_layout = body_panel->SetToBoxLayout(body_settings);\n',
            '        CefRefPtr<CefBoxLayout> body_layout = body_panel->SetToBoxLayout(body_settings);\n        aura::StyleSurface(body_panel, aura::kCanvas);\n')
          r(p,
            '    browser_host_ = CefPanel::CreatePanel(nullptr);\n    browser_host_->SetToFillLayout();\n',
            '    browser_host_ = CefPanel::CreatePanel(nullptr);\n    browser_host_->SetToFillLayout();\n    aura::StyleSurface(browser_host_, aura::kCanvas);\n')

          # Private mode stays icon-only and uses a subtle Aura-private chrome tint.
          p = "apps/desktop/browser_chrome.cpp"
          r(p,
            'void BrowserChrome::SetProfileLabel(const std::string& label) {\n'
            '    private_mode_ = label.find("Private") != std::string::npos;\n'
            '    if (profile_button_) {\n'
            '        profile_button_->SetText(label);\n'
            '    }\n'
            '    UpdatePrivatePresentation();',
            'void BrowserChrome::SetProfileLabel(const std::string& label) {\n'
            '    private_mode_ = label.find("Private") != std::string::npos;\n'
            '    UpdatePrivatePresentation();')
          r(p,
            'void BrowserChrome::UpdatePrivatePresentation() {\n'
            '    if (profile_button_) {\n'
            '        SetIcon(profile_button_, private_mode_ ? IconId::PrivateProfile : IconId::Profile);',
            'void BrowserChrome::UpdatePrivatePresentation() {\n'
            '    const auto chrome_surface = private_mode_ ? aura::kPrivateChromeSurface : aura::kChromeSurface;\n'
            '    aura::StyleSurface(container_, chrome_surface);\n'
            '    aura::StyleSurface(toolbar_, chrome_surface);\n'
            '    if (profile_button_) {\n'
            '        profile_button_->SetText("");\n'
            '        aura::StyleIconButton(profile_button_, private_mode_);\n'
            '        SetIcon(profile_button_, private_mode_ ? IconId::PrivateProfile : IconId::Profile);')

      - name: Verify patch
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test ! -z "$(git status --short)"
          grep -q 'kPrivateChromeSurface' apps/desktop/aura_design_tokens.h
          grep -q 'StyleSurface(root_panel, aura::kCanvas)' apps/desktop/desktop_app.cpp
          grep -q 'profile_button_->SetText("")' apps/desktop/browser_chrome.cpp
          if grep -q 'profile_button_->SetText(label)' apps/desktop/browser_chrome.cpp; then
            echo 'Private profile button still expands into a text control' >&2
            exit 1
          fi

      - name: Commit shell polish and remove migration workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/aura-shell-polish-migration.yml
          git add apps/desktop/aura_design_tokens.h apps/desktop/desktop_app.cpp apps/desktop/browser_chrome.cpp
          git diff --cached --check
          git commit -m "feat(design): harmonize Aura shell and private mode [aura-shell]"
          git push origin HEAD:design/aura-full-visual-polish
