name: Tab Close Lifecycle Fix

on:
  push:
    branches:
      - feat/ui-ux-hardening-icon-system

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[tab-close-fix]') }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout UI hardening branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: feat/ui-ux-hardening-icon-system
          fetch-depth: 0

      - name: Patch tab-only close lifecycle and regression coverage
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text(encoding="utf-8")
              if text.count(old) != 1:
                  raise SystemExit(f"Expected exactly one anchor in {path}: {old!r}")
              file.write_text(text.replace(old, new, 1), encoding="utf-8")

          replace_once(
              "apps/desktop/cef_tab_client.h",
              "    void OnAfterCreated(CefRefPtr<CefBrowser> browser) override;\n    void OnBeforeClose(CefRefPtr<CefBrowser> browser) override;",
              "    bool DoClose(CefRefPtr<CefBrowser> browser) override;\n    void OnAfterCreated(CefRefPtr<CefBrowser> browser) override;\n    void OnBeforeClose(CefRefPtr<CefBrowser> browser) override;",
          )

          replace_once(
              "apps/desktop/cef_browser_engine.h",
              "    void BeginWindowClose();\n    [[nodiscard]] bool CanCloseWindow();",
              "    // A browser tab closes inside the shared top-level window. CEF's\n    // default DoClose behavior forwards a close notification to that parent\n    // window; suppress it unless a real window shutdown is already underway.\n    [[nodiscard]] bool ShouldSuppressTopLevelCloseForTab() const;\n\n    void BeginWindowClose();\n    [[nodiscard]] bool CanCloseWindow();",
          )

          replace_once(
              "apps/desktop/cef_tab_client.cpp",
              "void CefTabClient::OnAfterCreated(CefRefPtr<CefBrowser> browser) {",
              "bool CefTabClient::DoClose(CefRefPtr<CefBrowser> /*browser*/) {\n    CEF_REQUIRE_UI_THREAD();\n\n    // CefLifeSpanHandler's default DoClose path forwards a standard close\n    // notification to the BrowserView's top-level parent. In Openbrowser that\n    // parent owns every tab, so an ordinary tab close must consume that\n    // notification instead of turning it into a window close. During an\n    // explicit window shutdown we return false and preserve CEF's normal\n    // top-level close flow.\n    return engine_ != nullptr && engine_->ShouldSuppressTopLevelCloseForTab();\n}\n\nvoid CefTabClient::OnAfterCreated(CefRefPtr<CefBrowser> browser) {",
          )

          replace_once(
              "apps/desktop/cef_browser_engine.cpp",
              "void CefBrowserEngine::BeginWindowClose() {",
              "bool CefBrowserEngine::ShouldSuppressTopLevelCloseForTab() const {\n    CEF_REQUIRE_UI_THREAD();\n    return !window_close_requested_;\n}\n\nvoid CefBrowserEngine::BeginWindowClose() {",
          )

          regression = r'''void TestBrowserSessionClosingFirstTabKeepsRemainingTabsAlive() {
              openbrowser::tests::FakeBrowserEngine engine;
              openbrowser::core::BrowserSession session(engine);

              Require(session.OpenTab(MakeTab("first", "https://first.test", "First")), "open first tab");
              Require(session.OpenTab(MakeTab("second", "https://second.test", "Second"), false), "open second tab in background");
              Require(session.OpenTab(MakeTab("third", "https://third.test", "Third"), false), "open third tab in background");
              Require(session.ActiveTabId() == std::optional<openbrowser::core::TabId>{"first"}, "first tab remains active before close");

              Require(session.CloseTab("first"), "close first active tab");
              Require(session.Tabs().size() == 2, "closing first tab keeps the remaining tabs");
              Require(session.FindTab("first") == nullptr, "closed first tab leaves the model");
              Require(session.ActiveTabId() == std::optional<openbrowser::core::TabId>{"second"}, "next tab becomes active after closing first tab");
              Require(session.FindTab("second") != nullptr && session.FindTab("second")->lifecycle == openbrowser::core::TabLifecycle::Active, "fallback tab is active");

              Require(session.OpenTab(MakeTab("fourth", "https://fourth.test", "Fourth")), "open another active tab");
              Require(session.CloseTab("second"), "close a non-active earlier tab");
              Require(session.Tabs().size() == 2, "closing non-active tab keeps session alive");
              Require(session.ActiveTabId() == std::optional<openbrowser::core::TabId>{"fourth"}, "closing non-active tab preserves active tab");
          }

          '''

          replace_once(
              "tests/core_tests.cpp",
              "void TestBrowserSessionNormalizesNewTabLifecycle() {",
              regression + "void TestBrowserSessionNormalizesNewTabLifecycle() {",
          )
          replace_once(
              "tests/core_tests.cpp",
              "    TestBrowserSessionNavigationAndCloseFallback();",
              "    TestBrowserSessionNavigationAndCloseFallback();\n    TestBrowserSessionClosingFirstTabKeepsRemainingTabsAlive();",
          )

      - name: Validate patch shape
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          grep -F 'bool DoClose(CefRefPtr<CefBrowser> browser) override;' apps/desktop/cef_tab_client.h
          grep -F 'ShouldSuppressTopLevelCloseForTab' apps/desktop/cef_browser_engine.cpp
          grep -F 'TestBrowserSessionClosingFirstTabKeepsRemainingTabsAlive' tests/core_tests.cpp

      - name: Commit functional fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/desktop/cef_tab_client.h apps/desktop/cef_tab_client.cpp \
            apps/desktop/cef_browser_engine.h apps/desktop/cef_browser_engine.cpp \
            tests/core_tests.cpp
          git diff --cached --check
          git commit -m "fix(tabs): keep window open when closing a tab [tab-close-fix]"
          git push origin HEAD:feat/ui-ux-hardening-icon-system
